<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <div class="dashboard-header">
            <h1>Admin Dashboard - <span id="adminName"></span></h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <!-- Purchase for Customer -->
        <div class="card">
            <h2>Record a Purchase</h2>
            <p id="purchaseForMsg" class="msg"></p>
            <form id="purchaseForForm" class="inline-form">
                <select id="purchaseCustomerId" required></select>
                <select id="purchaseProductId" required></select>
                <button type="submit">Record Purchase</button>
            </form>
        </div>

        <!-- Purchase Confirmation Modal -->
        <div id="confirmPurchaseModal" class="modal-overlay" style="display:none;">
            <div class="modal-box">
                <h3 id="confirmPurchaseText"></h3>
                <p>This amount will be deducted from the customer's wallet.</p>
                <div class="modal-actions">
                    <button class="modal-cancel" onclick="closeConfirmPurchaseModal()">Cancel</button>
                    <button class="modal-confirm" onclick="proceedWithPurchase()">Confirm</button>
                </div>
            </div>
        </div>

        <!-- Create Customer -->
        <div class="card">
            <h2>Create Customer</h2>
            <p id="createCustomerMsg" class="msg"></p>
            <form id="createCustomerForm" class="inline-form">
                <input type="text" id="custName" placeholder="Name" required>
                <input type="email" id="custEmail" placeholder="Email" required>
                <input type="password" id="custPassword" placeholder="Password" required>
                <button type="submit">Create</button>
            </form>
        </div>

        <!-- Deposit Money -->
        <div class="card">
            <h2>Deposit Money</h2>
            <p id="depositMsg" class="msg"></p>
            <form id="depositForm" class="inline-form">
                <select id="depositCustomerId" required></select>
                <input type="number" id="depositAmount" placeholder="Amount" step="0.01" required>
                <button type="submit">Deposit</button>
            </form>
        </div>

        <!-- Add Product -->
        <div class="card">
            <h2>Add Product</h2>
            <p id="productMsg" class="msg"></p>
            <form id="productForm" class="inline-form">
                <input type="text" id="prodName" placeholder="Product name" required>
                <input type="number" id="prodPrice" placeholder="Price" step="0.01" required>
                <button type="submit">Add Product</button>
            </form>
        </div>

        <!-- Products List -->
        <div class="card">
            <h2>All Products</h2>
            <div class="product-grid" id="productsGrid"></div>
        </div>

        <!-- Customers List -->
        <div class="card">
            <h2>All Customers</h2>
            <table>
                <thead>
                    <tr><th>ID</th><th>Name</th><th>Email</th><th>Actions</th></tr>
                </thead>
                <tbody id="customersTableBody"></tbody>
            </table>
        </div>

        <!-- Purchase History Modal -->
        <div id="purchaseModal" class="modal-overlay" style="display:none;">
            <div class="modal-box" style="width:400px; text-align:left;">
                <h3 id="purchaseModalTitle"></h3>
                <table style="margin-top:14px;">
                    <thead>
                        <tr><th>Product</th><th>Price</th><th>Date</th></tr>
                    </thead>
                    <tbody id="purchaseModalBody"></tbody>
                </table>
                <button class="modal-cancel" style="margin-top:16px;" onclick="closePurchaseModal()">Close</button>
            </div>
        </div>
    </div>


    <script src="Config.js"></script>
    <script src="Admin.js"></script>
</body>
</html>
