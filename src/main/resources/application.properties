spring.application.name=wallet-system
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/gym_wallet_db?createDatabaseIfNotExist=true
spring.datasource.username=YOUR_UDERNAME
spring.datasource.password=YOUR_MYSQL_PASSWORD_HERE
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=ThisIsASecretKeyForGymWalletSystemChangeInProduction123456
jwt.expiration=86400000